# 相对目录默认以本文件所在目录为基准。
# package / diff 的 -root DIRECTORY 仅覆盖相对 sources.directory 的基准；绝对资源路径不变。
# -root 自身的相对路径按命令执行目录解析；output 和索引位置不受影响。
# 构建索引存入旁边的 .quire/<project>/；同目录相同 project 共用基线和 Tag。

# 可选；默认 1，目前只支持 1。
version: 1
# 必填；不可为空。不同 project 独立；更改名称不会迁移已有基线。
# init PROJECT [DIRECTORY] 写入项目名，并创建 quire.<project>.yml。
project: "my-project"
# 可选；默认 ./dist，直接指定最终目录，实际产物为 <output>/<包名>.<suffix>。
# 不自动追加 Tag 子目录；支持与 name 相同的 12 个变量，共用本次 Tag 和冻结的时间。
# 静态包名需保留历史版本时可改为 ./dist/{tag}；平铺目录也可搭配动态 name。
# 已有同名输出文件或目录会使本次构建报错，不覆盖；无关文件保留。
# 推荐动态目录放在固定父目录下，例如 ./dist/{tag}，该输出区域自动排除源扫描。
# 不能包含项目根目录，也不能位于 .quire/ 内；缺少的输出目录在打包时创建。
output: "./dist/my-project"
# 可选；默认 asset；可填写 asset 或 .asset，输出文件使用此后缀。
suffix: asset
# 可选；默认 lz4；可选 none（不压缩）、lz4、zlib。
# 可由每个包的 compression 独立覆盖；不影响 AES-256-GCM 加密设置。
compression: lz4
# 可选；默认 adaptive；可选 adaptive、always，可由每个包独立覆盖。
# adaptive 仅在块压缩后更小时保留压缩结果；always 即使变大也保存压缩结果。
# compression 为 none 时不压缩，此策略不生效。
compression-policy: adaptive

# 整段可选；省略时使用下面字段的默认值。
build:
  # 可选；默认 0，按逻辑 CPU 数与管线缓冲预算自动选择工作线程数。
  # 显式整数范围 1–256；命令行 -jobs 可覆盖。自动值是启发式选择。
  jobs: 0
  # 可选；默认 128，单位 MiB，整数范围 8–65536。
  # 管线缓冲按每个工作线程 7 块另加公共预留估算，包含 ArrayPool 容量取整。
  # 不是进程总内存或 zlib 原生分配的硬上限；资源清单、路径和 Meta 等另计。
  # 显式 jobs 和块大小超过预算时报错；改变预算不会产生内容补丁。
  memory-mib: 128
  # 可选；默认 262144 字节（256 KiB）。
  # 可选值：65536、131072、262144、524288、1048576。
  # 影响新写入内容的压缩/加密块和局部读取粒度；不会重打未变化的资源。
  block-size: 262144

# 可选；默认 none，不加密、不签名。填入全局密钥名时启用 AES-256-GCM 并签名。
# 先执行 quire-cli keys add KEYNAME PASSWORD；多个项目可引用同一名称。
# 指定的名称不存在时打包失败。YAML 不接受 encryption 或密码字段。
secret-key: none

# 必填；至少一个包。包名及 output 支持 Tag 与日期时间变量。
packages:
  # 必填；无默认值；本项生成 common.asset，也可写为 "Patch-{tag}-{date}_{time}"。
  # 变量区分大小写：{tag} 为本次 Tag 名，{tagid} 为内部 8 位小写十六进制 ID。
  # 日期时间变量：{yyyy}、{MM}、{dd}、{HH}、{mm}、{ss}、{fff}（3 位毫秒）。
  # {date}=yyyyMMdd，{time}=HHmmss，{timestamp}=Unix 秒；日期时间使用本地时区。
  # 同次构建共用冻结的时间，数字格式固定；变量值不递归展开，未知变量报错。
  # 组合示例："Patch-{tag}-{yyyy}{MM}{dd}_{HH}{mm}{ss}"；不支持 {yyyyMMdd} 或 |。
  # 展开后须为合法单个文件名组件，允许 Unicode、点、内部空格及开头的 -。
  # 禁止路径分隔符、Windows 文件名非法字符、控制字符、设备保留名、首尾空白或末尾点。
  # 完整 <包名>.<suffix> 最多 255 个 UTF-8 字节；展开后不区分大小写且必须唯一。
  # package 扫描前校验展开结果；diff 保留模板，不生成 Tag 或内部 ID。
  # 动态包名不会重打未变资源；本模板保留静态名称，方便直接运行。
  - name: common
    # 可选；省略时继承全局 compression；可选 none、lz4、zlib。
    compression: lz4
    # 可选；独立继承全局 compression-policy；可选 adaptive、always。
    compression-policy: adaptive
    # 必填；至少一个源目录，无默认值。这里的两个目录合并到同一个包。
    sources:
      # 必填；无默认值，打包前必须存在。相对目录按 -root 或本文件所在目录解析。
      # 绝对目录始终按原路径读取，不受 -root 影响。
      # 源目录可以位于项目之外，但不能位于输出目录或 .quire/ 中。
      - directory: "./assets/my-project/common"
        # 可选；默认空字符串，即直接使用源目录中的相对文件路径。
        # 支持 common/data 等多级目录，统一使用 /，不能包含 . 或 .. 路径段。
        # 此例将 settings.txt 映射为 common/data/settings.txt。
        prefix: common/data
        # 可选；省略时包含所有资源文件。列表中任意模式匹配即包含。
        # 模式相对本源目录，区分大小写，支持 *、?、**；建议用引号包住模式。
        # 允许开头带 ./；*.png 或 ./*.png 仅匹配第一层，**/*.png 匹配所有层级。
        include:
          - "**/*"
        # 可选；省略时没有额外排除规则。排除优先于 include，.assetignore 仍生效。
        # 列表中任意模式匹配即排除；单独排除 .meta 等价于本次没有该 Meta。
        # 与 include 使用相同的模式语法，也支持 ./ 前缀。
        exclude:
          - "**/*.tmp"
          - "**/draft/**"
      # 必填；第二个源目录，无默认值，目录解析规则与上面相同。
      - directory: "./assets/my-project/shared"
        # 可选；默认空字符串。使用不同前缀可避免与第一个源目录重复映射。
        prefix: common/shared
        # 可选；省略时包含所有资源；这里显式包含所有层级的文件。
        include:
          - "**/*"
        # 可选；省略时不额外排除；这里排除备份文件。
        exclude:
          - "**/*.bak"
  # 必填；另一个唯一包名，无默认值；本项生成独立的 locale.asset。
  - name: locale
    # 可选；默认继承全局 lz4；这里显式设为 none，关闭本包压缩。
    compression: none
    # 必填；非空源目录列表，无默认值。
    sources:
      # 必填；无默认值，打包前必须存在。
      - directory: "./assets/my-project/locale"
        # 可选；默认空字符串；这里将 welcome.txt 映射为 strings/welcome.txt。
        prefix: strings
        # 可选；省略时包含所有资源。
        include:
          - "**/*"
        # 可选；省略时没有额外排除规则。
        exclude:
          - "**/*.tmp"

# 同一包内重复的资源路径会报错。跨包同路径按未展开的 name 模板 Ordinal 排序，
# 仅打包最后一个来源，首次全量也适用；Tag 或时间变量不改变来源优先级。
# Meta 固定为 file.ext.meta，采用 property=value；没有 Meta 时省略 sidecar。
# 空 sidecar 表示存在空 Meta；不配置 metadata.format。
# 创建候选：quire-cli package -f FILE（指定配置，基于该项目的正式基线打包）
# 指定名称：quire-cli package -tag 20261031；省略 -tag 时自动生成 8 位十六进制名称。
# 测试通过：quire-cli commit 20261031（此时才推进正式基线，不重新扫描源文件）
# 当前变化：quire-cli diff（当前源文件相对已提交基线的 A/M/D）
# 历史变化：quire-cli changes 20261031（该 Tag 打包时记录的 A/M/D，不扫描源文件）
# 指定配置：quire-cli diff -f ./quire.patch.yml；同目录且相同 project 的配置共用基线。
# 切换资源根：quire-cli package -f FILE -root D:/game_root；仅 package / diff 支持 -root。
# 以下省略 -f 的命令默认读取 quire.project.yml，命名配置需要添加 -f FILE。
# 放弃候选：quire-cli remove 20261031（仅删除未提交记录，保留产物）
# 添加全局密钥：quire-cli keys add game PASSWORD（不依赖当前目录或项目配置）
# 列出密钥：quire-cli keys list（FINGERPRINT、KEYNAME、CLIENTKEY）
# 查看客户端密钥：quire-cli keys show game（只输出一行 Base64，可传给 AssetKey(string)，不写文件）
# 加密打包：设置 secret-key: game 后直接执行 quire-cli package
# 导出客户端密钥：quire-cli keys export game ./client.key（不会自动导出）
# 客户端读取：quire-cli verify ./dist -key ./client.key
# 并发解包：quire-cli unpackage ./dist ./unpacked -key ./client.key -jobs 5 -suffix asset
